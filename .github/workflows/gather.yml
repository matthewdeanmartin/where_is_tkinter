name: Gather TkInter Data

# Manual trigger only — run this when you want to probe a new OS or
# when new Python versions have been released.  Download the artifacts
# and commit them to data/ yourself.
on:
  workflow_dispatch:

jobs:
  gather:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_key: linux
          - os: macos-latest
            os_key: macos
          - os: windows-latest
            os_key: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Gather tkinter data for ${{ matrix.os_key }}
        run: uv run python gather_data.py

      - name: Upload data artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-${{ matrix.os_key }}
          path: data/${{ matrix.os_key }}.json
          retention-days: 30

  # No commit-back job — download the artifacts from the Actions UI and
  # commit data/*.json to the repo yourself.
