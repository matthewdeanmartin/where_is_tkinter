name: Gather TkInter Data

# Manual trigger only — run this when you want to probe a new OS or
# when new Python versions have been released.  Download the artifacts
# and commit them to data/ yourself.
on:
  workflow_dispatch:

jobs:
  gather:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_key: linux
          - os: macos-latest
            os_key: macos
          - os: windows-latest
            os_key: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Gather tkinter data for ${{ matrix.os_key }}
        run: uv run python gather_data.py

      - name: Upload data artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-${{ matrix.os_key }}
          path: data/${{ matrix.os_key }}.json
          retention-days: 30

  # No commit-back job — download the artifacts from the Actions UI and
  # commit data/*.json to the repo yourself.
